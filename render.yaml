services:
  - type: web
    name: osentinel
    runtime: python
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "python3 -m backend.main"
    envVars:
      - key: PORT
        value: 8000
      # Cloud deploy needs to listen on all interfaces. NOTE: in the cloud OSentinel
      # monitors the Render container, not your laptop. Run locally for real monitoring.
      - key: OSENTINEL_HOST
        value: 0.0.0.0
